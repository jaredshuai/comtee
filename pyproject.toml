[project]
name = "comtee"
version = "0.1.0"
description = "串通：常驻串口三通。人走本机 Telnet，Agent 走命名管道，NiceGUI 管理面板。"
requires-python = ">=3.14"
dependencies = [
    "nicegui>=3.16.0",
    "pillow>=12.3.0",
    "pyserial>=3.5",
    "pystray>=0.19.5",
    "pywebview>=6.2.1",
]

[project.scripts]
comtee-mcp = "comtee.mcp:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "ty>=0.0.79",
]
packaging = [
    "nuitka>=4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
