# 安装包构建与发版仅保留手工触发：推 vX.Y.Z tag 不自动跑 Nuitka 或发 Release。
# workflow_dispatch（publish_release=false）：只打安装包并上传制品，不建 Release。
# workflow_dispatch（publish_release=true）：核对存在匹配当前版本的 vX.Y.Z tag 后打安装包并发布 GitHub Release。
name: Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish GitHub Release for current pyproject version (requires matching vX.Y.Z tag)"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Package and publish
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --group dev --group packaging

      - name: Quality gates
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run ty check
          uv run pytest

      - name: Check tag matches project version
        id: version
        if: inputs.publish_release == true
        run: |
          $version = (uv run python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])").Trim()
          $tagCommit = (git rev-parse --verify "refs/tags/v$version^{}").Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Missing matching tag v$version for GitHub Release"
          }
          $headCommit = (git rev-parse HEAD).Trim()
          if ($tagCommit -ne $headCommit) {
            throw "Tag v$version ($tagCommit) does not point to HEAD ($headCommit)"
          }
          uv run python -m comtee.release_tag --tag "v$version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Enable MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: pwsh -NoProfile -File installer/build.ps1 -Force

      - name: Upload setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: comtee-setup
          path: installer/dist/Comtee-Setup-*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: inputs.publish_release == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $setup = Get-ChildItem -Path installer/dist -Filter "Comtee-Setup-*.exe" |
            Select-Object -First 1
          if (-not $setup) {
            throw "Comtee-Setup-*.exe not found"
          }
          $version = "${{ steps.version.outputs.version }}"
          gh release create "v$version" $setup.FullName --generate-notes --title "串通 $version"
